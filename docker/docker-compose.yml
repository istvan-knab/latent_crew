services:
  latent-crew:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - ../src:/app/src
      - ../scripts:/app/scripts
      - ../configs:/app/configs
      - ../data:/app/data
      - ../checkpoints:/app/checkpoints
      - ../outputs:/app/outputs
    environment:
      - WANDB_API_KEY # passed through from the host shell, never stored in the repo
      - WANDB_DATA_DIR=/app/outputs/wandb-data # artifact staging survives --rm for offline sync
      - WANDB_CACHE_DIR=/app/outputs/wandb-cache
    working_dir: /app
