[project]
name = "latent-crew"
version = "0.1.0"
description = "3D object detection and segmentation on SUN RGB-D and NYU Depth V2"
requires-python = ">=3.14"
dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "opencv-python",
    "open3d",
    "scipy<1.18",
    "pyyaml",
    "tqdm",
    "segmentation-models-pytorch>=0.5.0",
    "timm>=1.0.30",
    "matplotlib>=3.11.2",
    "wandb>=0.31.0",
    "h5py<3.16",
    "requests>=2.34.2",
    "pillow>=12.3.0",
    "neural-pipeline-search>=0.17",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
