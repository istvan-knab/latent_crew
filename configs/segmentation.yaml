# Segmentation config. Encoder and decoder options with pros/cons: docs/segmentation_models.md

experiment:
  name: sunrgbd_rgbd_resnet50_deeplabv3plus
  seed: 42
  output_dir: checkpoints

dataset:
  name: sunrgbd # only SUN RGB-D is supported
  root: data/processed/sunrgbd
  num_classes: 37 # label 0 (unlabeled) is not a class
  ignore_index: 255 # unlabeled pixels are remapped 0 -> 255 and left out of the loss and mIoU
  modalities: [rgb, depth] # [rgb] = 3 input channels, [rgb, depth] = 4 (early fusion)

model:
  decoder: deeplabv3plus # unet | fpn | deeplabv3 | deeplabv3plus | pspnet | upernet | segformer
  encoder: resnet50 # smp name (resnet50, mit_b2, efficientnet-b0, ...) or tu-<timm model> (tu-convnext_tiny)
  encoder_weights: imagenet # or null for random init
  decoder_kwargs: {} # passed to the smp architecture, e.g. {encoder_output_stride: 16}
  dropout: 0.0 # Dropout2d before the segmentation head, 0 = off (DeepLab/PSPNet heads use ~0.1)

training:
  epochs: 100
  batch_size: 8
  optimizer: sgd # sgd for CNN encoders, adamw for transformer encoders
  lr: 0.01 # decoder LR; adamw: ~6e-5
  momentum: 0.9 # sgd only
  weight_decay: 0.0001 # adamw: ~0.01
  scheduler: poly # poly | cosine
  warmup_iters: 500
  encoder_lr_mult: 0.1 # encoder LR = lr * encoder_lr_mult (pretrained weights move slower)
  loss: ce # ce | dice_ce (cross-entropy + soft Dice, helps rare classes)
  label_smoothing: 0.0 # cross-entropy label smoothing, 0 = off (regulariser against overconfidence)
  l1_lambda: 0.0 # L1 penalty on conv/linear weights, 0 = off (L2 is weight_decay)
  class_weighting: none # none | median_frequency
  amp: true # mixed precision (bfloat16 on CUDA)
  eval_every: 1 # validate every N epochs
  early_stopping_patience: 10 # stop after N validations without val mIoU gain; 0 = off (train all epochs)
  log_every: 20 # log training loss and LR every N iterations

augmentation: # geometric ops apply to rgb, depth and mask alike; color jitter to rgb only
  crop_size: [480, 640] # [height, width], multiples of 32
  scale_range: [0.5, 2.0]
  hflip: true
  color_jitter: 0.2
  # Rare-class augmentation, all off here (configs/experiments/{copy_paste,rare_sampling,rare_class_aug}.yaml)
  rare_classes: 12 # the 12 classes with the smallest pixel share in the train split count as rare
  copy_paste_prob: 0.0 # paste rare objects (rgb + depth + label) from other images into a sample; 0 = off
  copy_paste_max_objects: 3 # 1..N objects per pasted sample
  rare_crop_prob: 0.0 # place the random crop around a rare-class pixel; 0 = off
  repeat_factor_threshold: 0.0 # oversample images with classes seen in < this share of images (LVIS); 0 = off

hardware:
  device: cuda # cuda | mps (Apple) | cpu; fails if the device is not available
  num_workers: 4

logging: # Weights & Biases
  project: latent-crew
  entity: null # W&B team or user name, null = your default entity
  mode: online # online | offline (sync later with `wandb sync`) | disabled
  num_sample_images: 4 # fixed validation images (RGB, depth, label, prediction) in the samples/ section
  tags: [] # extra tags, e.g. [rgbd, baseline]
  log_model: true # upload best.pt, last.pt and config.yaml as a W&B model artifact (sweep trials turn it off)
