# Experiment: L1 + stronger L2 together (elastic net): l1_lambda 1e-5 and weight_decay 5e-4.
# L1 drives unimportant weights to zero, L2 keeps the remaining ones small; the two penalties simply add up.
base: ../segmentation.yaml
experiment:
  name: sunrgbd_rgbd_resnet50_deeplabv3plus_elasticnet
training:
  weight_decay: 0.0005
  l1_lambda: 1.0e-5
logging:
  tags: [elastic_net, l1, weight_decay]
