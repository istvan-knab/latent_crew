# heads. (The ASPP module of smp DeepLabV3+ already has a fixed dropout of 0.5; this adds one more right at the head.)
base: ../segmentation.yaml
experiment:
  name: sunrgbd_rgbd_resnet50_deeplabv3plus_dropout0.1
model:
  dropout: 0.1
logging:
  tags: [dropout]
